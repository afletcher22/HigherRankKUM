status:
  scope: >-
    Formalizes the full rank-four case: every finite uniformly dense matroid of
    rank four, of any size, has a cyclic basis ordering. The higher-rank
    conjecture is not claimed. One step (ten-element pair chains) is a SAT
    certificate whose LRAT refutation, encoding and soundness bridge are all
    checked by the Lean kernel, without native_decide or ofReduceBool.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "HigherRankKUM.Palomar.rankFourKUM"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

