version: "v0.4"

project:
  name: "HigherRankKUM: the Kajitani-Ueno-Miyano conjecture in rank four"
  description: >-
    Lean 4 formalization of the rank-four case of the Kajitani-Ueno-Miyano
    cyclic basis ordering conjecture: every finite uniformly dense matroid of
    rank four (r(M)|X| <= |E| r(X) for every subset X) admits a cyclic ordering
    of its ground set in which every four cyclically consecutive elements form
    a basis. There is no condition on the size of the ground set. The proof
    combines a formalization of the van den Heuvel-Thomasse cyclic-ordering
    theorem (coprime sizes, Edmonds partitions and double covers), Kotlar-Ziv
    serial symmetric exchange in rank four, a pair-chain insertion theorem that
    extends a cyclic basis ordering across a deleted basis, a hitting lemma that
    finds a deletable basis, the vendored rank-three theorem, and one
    kernel-checked SAT certificate (14,738 LRAT hints) for ten-element pair
    chains.
  authors:
    - "Austen Fletcher"  # TODO(owner): confirm
  license: "MIT"
  responsible_maintainers:
    - "Austen Fletcher"  # TODO(owner): confirm

