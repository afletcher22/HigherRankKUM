name = "HigherRankKUM"
version = "0.1.0"
defaultTargets = ["HigherRankKUM"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0-rc2"

[[lean_lib]]
name = "Rank3KUM"
srcDir = "vendor/Rank3KUM"

[[lean_lib]]
name = "HigherRankKUM"

# Phase 0 measurement probes (probe branches only; not part of the default target)
[[lean_lib]]
name = "Probe"
srcDir = "probes"
roots = ["Probe.ChallengeDraft", "Probe.Kum6", "Probe.Kum8", "Probe.Kum8Core", "Probe.Cyc8Core", "Probe.Enc", "Probe.EncKum6", "Probe.EncKum8", "Probe.EncSound", "Probe.EncKum6Sound"]
