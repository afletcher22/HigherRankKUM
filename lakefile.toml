name = "HigherRankKUM"
version = "0.1.0"
defaultTargets = ["HigherRankKUM"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Rank3KUM"
srcDir = "vendor/Rank3KUM"

[[lean_lib]]
name = "HigherRankKUM"

# vHT development probes (probe branches only; not part of the default target)
[[lean_lib]]
name = "Probe"
srcDir = "probes"
globs = ["Probe.+"]
