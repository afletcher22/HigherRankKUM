name = "HigherRankKUM"
version = "0.1.0"
defaultTargets = ["HigherRankKUM"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Rank3KUM"
srcDir = "vendor/Rank3KUM"

[[lean_lib]]
name = "HigherRankKUM"

# Encoding-layer probes (probe branches only; not part of the default target)
[[lean_lib]]
name = "Probe"
srcDir = "probes"
roots = ["Probe.ChallengeDraft", "Probe.Enc", "Probe.EncSound", "Probe.EncKum6", "Probe.EncKum6Sound", "Probe.EncBridge", "Probe.EncKum6Final"]
