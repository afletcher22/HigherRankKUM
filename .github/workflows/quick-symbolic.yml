name: Quick Symbolic Lean

on:
  push:
    branches:
      - sol-symbolic-adjacent

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies
        run: lake update
      - name: Build symbolic target
        run: lake build +HigherRankKUM.Rank4.DangerousScheduleSymbolicBasis
