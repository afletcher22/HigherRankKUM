name: Lean CI

on:
  push:
    branches:
      - main
      - 'palomar/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies
        run: lake update
      - name: Verify dependency lock
        run: git diff --exit-code -- lake-manifest.json
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build everything
        shell: bash
        run: /usr/bin/time -v lake build 2>&1 | tee build.log
      - name: Replay the solution with leanchecker
        shell: bash
        run: /usr/bin/time -v lake env leanchecker Solution 2>&1 | tee replay.log
      - name: Axiom guard
        shell: bash
        run: |
          grep -h "depends on axioms" build.log | sort -u
          if grep -hE "ofReduceBool|sorryAx|trustCompiler" build.log replay.log; then
            echo "Forbidden axiom found"; exit 1
          fi
          grep -q "'HigherRankKUM.Palomar.rankFourKUM' depends on axioms: \[propext, Classical.choice, Quot.sound\]" build.log
