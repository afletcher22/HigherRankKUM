name: Validate vendored Rank3KUM v3

on:
  push:
    branches:
      - vendor-rank3-v3

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vendor-rank3-v3
          fetch-depth: 0

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        run: lake update

      - name: Verify dependency lock
        run: git diff --exit-code -- lake-manifest.json

      - name: Build HigherRankKUM with vendored rank three
        run: lake build

      - name: Freeze vendor integrity manifest
        run: |
          set -euo pipefail
          cd vendor/Rank3KUM
          { find Rank3KUM -type f -name '*.lean' -print; echo Rank3KUM.lean; } \
            | LC_ALL=C sort \
            | xargs sha256sum > SHA256SUMS
          cd ../..
          rm -f .github/workflows/validate-vendored-rank3.yml

      - name: Commit validated vendor manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/Rank3KUM/SHA256SUMS .github/workflows/validate-vendored-rank3.yml
          git commit -m "vendor: certify frozen Rank3KUM v3 snapshot"
          git push origin HEAD:vendor-rank3-v3
