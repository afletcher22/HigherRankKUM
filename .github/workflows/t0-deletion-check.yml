name: Rank4 T0 Deletion Check

on:
  push:
    branches:
      - sol-rank4-t0-deletion
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/packages
          key: lean-deps-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.toml') }}
      - name: Fetch pinned dependencies
        run: lake update
      - name: Build t0 deletion package
        run: lake build +HigherRankKUM.Rank4.T0Deletion
